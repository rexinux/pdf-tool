name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pillow pyinstaller

      - name: Build EXE with PyInstaller (console mode - easier to debug)
        shell: pwsh
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          pyinstaller --onefile --noconfirm --name "PDF Toolkit" pdf-toolkit.py

      - name: Show build warnings (if present)
        shell: pwsh
        run: |
          if (Test-Path build) {
            Get-ChildItem -Path build -Filter "warn-*.txt" -Recurse | ForEach-Object { Write-Host "`n=== WARNINGS: $($_.FullName) ===`n"; Get-Content $_.FullName }
          }

      - name: List dist contents
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -Recurse | Format-Table -AutoSize

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-tool-windows
          path: dist\*.exe
